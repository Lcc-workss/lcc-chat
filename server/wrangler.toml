#:schema node_modules/wrangler/config-schema.json
name = "lcc-chat"
main = "src/index.ts"
compatibility_date = "2026-04-07"

# ---------------------------------------------------------------- Durable Objects
# One DO instance per conversation (DM or group) + one per user session hub
# + a single global presence registry.
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "USER_SESSION"
class_name = "UserSession"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom", "UserSession", "Presence"]

# ---------------------------------------------------------------- Workers KV
# Profiles, display names, avatars, conversation lists, feature flags,
# cached media (PeerJS/TURN) configuration. Never used for live messages.
# Create with:  wrangler kv namespace create PROFILES
# then paste the returned id below.
[[kv_namespaces]]
binding = "PROFILES"
id = "replace-with-your-kv-namespace-id"

# ---------------------------------------------------------------- Vars
[vars]
# Long random string. Set it properly with:  wrangler secret put TOKEN_SECRET
# (Left empty so local `wrangler dev` works; the server falls back to a
#  clearly-labelled development secret and warns you.)
TOKEN_SECRET = ""

# WebRTC ICE configuration. TURN is optional in development but required in
# production. Never hardcode real TURN credentials in /client — the Worker
# serves them to authenticated clients from `/api/media/config`.
# Recommended: wrangler secret put TURN_URL / TURN_USERNAME / TURN_CREDENTIAL
STUN_URLS = "stun:stun.l.google.com:19302"

# PeerJS signaling. Leave PEER_HOST empty to use the public PeerJS Cloud
# (development only). For production self-host PeerServer and set e.g.
# PEER_HOST = "peer.internal.example.com" and PEER_SECURE = "true".
PEER_HOST = ""
PEER_PORT = "443"
PEER_PATH = "/"
PEER_SECURE = "true"

# Abuse limits (per user, best effort).
MAX_MESSAGE_LENGTH = "4000"
MESSAGES_PER_MINUTE = "60"